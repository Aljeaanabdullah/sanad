name: CI

on:
  pull_request:
  push:
    branches: [main, "phase-*"]
  workflow_dispatch:

jobs:
  admin:
    name: Web panel (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile app (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      # The JavaScript bundle must build for Android (catches missing imports / bad routes).
      - run: npx expo export --platform android --output-dir /tmp/sanad-export

  # Sanad: the Android app file (APK) to install on a phone. Download it from the run's "Artifacts".
  android-apk:
    name: Android APK
    needs: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # Firebase for push notifications (PRD 9): google-services.json comes from the GOOGLE_SERVICES_JSON
      # secret (raw JSON or base64) and is never committed. Without the secret the APK still builds;
      # the phone just cannot register for push. app.config.ts adds the file only when it exists.
      - name: Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON is not set: building without push."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          if ! node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))" 2>/dev/null; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          fi
          node -e "const j=JSON.parse(require('fs').readFileSync('google-services.json','utf8')); const ok=(j.client||[]).some(c=>c.client_info?.android_client_info?.package_name==='com.sanad.hr'); if(!ok){console.error('google-services.json has no com.sanad.hr app');process.exit(1)} console.log('google-services.json written for com.sanad.hr')"
      # Native Android project from app.json (not kept in git), then a release APK.
      # Signed with the debug key for testing on phones; a store build will use EAS / a real key.
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: sanad-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  functions:
    name: Edge functions (punch, device-key, send-push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Runs the real punch and device-key functions against an in-memory fake database (PRD 4.6 / 4.7 rules),
      # and the Android Key Attestation check against test chains and a real Google sample chain.
      - run: node --import ./supabase/functions/punch/test/register.mjs --test 'supabase/functions/punch/test/*.test.mjs'
      # send-push (PRD 9) against a fake database and a fake fetch: signed service-account JWT, FCM HTTP v1
      # message per language, emergency channel, unregistered tokens removed, retries, no key = not_configured.
      - run: node --import ./supabase/functions/send-push/test/register.mjs --test 'supabase/functions/send-push/test/*.test.mjs'

  secrets:
    name: No secrets in repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
